name: Backend API CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rmbreeding
          POSTGRES_PASSWORD: rmbreeding
          POSTGRES_DB: rmbreeding
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and Package with Maven
        run: mvn clean package -DskipTests

      - name: Stage Deployment Files
        run: |
          mkdir -p staging/target
          cp target/rm-breeding-api-*.jar staging/target/
          cp Dockerfile staging/
          cp docker-compose.yml staging/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: staging/
          retention-days: 3

  deploy:
    name: Deploy to Production VPS
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-artifacts
          path: staging/

      - name: Check if Deploy Key is configured
        id: check_key
        run: |
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "SSH Key secret SERVER_SSH_KEY is not configured yet in GitHub Secrets."
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Copy files to VPS
        if: steps.check_key.outputs.has_key == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '62.171.162.167' }}
          username: ${{ secrets.SERVER_USER || 'romel' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "staging/*"
          target: "/home/romel/rmbreeding/api"
          strip_components: 1
          overwrite: true

      - name: Restart API container on VPS
        if: steps.check_key.outputs.has_key == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '62.171.162.167' }}
          username: ${{ secrets.SERVER_USER || 'romel' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/romel/rmbreeding/api
            docker compose up -d --build --force-recreate
            echo "API successfully deployed and running!"
